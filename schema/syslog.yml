---
name: syslog
reconfigureEndpoint: "/syslog/service/reconfigure"
resources:
  - name: Destination
    filename: destination
    monad: destination
    endpoints:
      add: "/syslog/settings/addDestination"
      get: "/syslog/settings/getDestination"
      update: "/syslog/settings/setDestination"
      delete: "/syslog/settings/delDestination"
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Transport
        type: SelectedMap
        key: transport
      - name: Level
        type: SelectedMapList
        key: level
      - name: Facility
        type: SelectedMapList
        key: facility
      - name: Program
        type: SelectedMapList
        key: program
      - name: Hostname
        type: string
        key: hostname
      - name: Certificate
        type: SelectedMap
        key: certificate
      - name: Port
        type: string
        key: port
      - name: Rfc5424
        type: string
        key: rfc5424
      - name: Suppress
        type: string
        key: suppress
        omitEmpty: true
      - name: Description
        type: string
        key: description
rpc:
  - name: General
    filename: general
    rpc_calls:
      - name: Get
        endpoint: /syslog/settings/get
        method: GET
        result_type: GeneralSettingsWrapper
      - name: Set
        endpoint: /syslog/settings/set
        method: POST
        params:
          - name: syslog
            optional: true
            bodyParameter: false
            customType: GeneralSettingsBody
        result_type: api.ActionResult
      - name: Reconfigure
        endpoint: /syslog/service/reconfigure
        method: POST
        result_type: api.ReconfigureStatusResult
    customTypes:
      GeneralSettingsWrapper:
      - name: Syslog
        type: GeneralSettingsBody
        key: syslog

      GeneralSettingsBody:
      - name: General
        type: GeneralSettings
        key: general

      GeneralSettings:
      - name: Enabled
        type: string
        key: enabled
      - name: LogLocal
        type: string
        key: loglocal
      - name: MaxPreserve
        type: string
        key: maxpreserve
      - name: MaxFileSize
        type: string
        key: maxfilesize
